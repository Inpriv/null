<!doctype html>
<html lang="en">
<head>
  <title>watcher — null</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" type="image/png" href="/assets/favicon.png?v=1">
<link rel="stylesheet" href="/assets/base.css?v=5">
<script defer src="/assets/base.js?v=6"></script>
<script>
  // The page is watching you.
  // Every five seconds, it whispers into your console.
  // The first whisper is a question; the second is the answer.
  let whispers = [
    "Are you still here?",
    "/exit/. Look at the address bar. Type it.",
    "/exit/. Or click the obvious 'finish' button. It does nothing.",
    "The obvious button does nothing on purpose."
  ];
  window.__whisperIdx = 0;
  setTimeout(function loop() {
    const w = whispers[window.__whisperIdx % whispers.length];
    try { console.log("%c[whisper]", "color:#8ab4ff;", w); } catch(_) {}
    window.__whisperIdx++;
    setTimeout(loop, 5000);
  }, 5000);

  // The 'finish' button is a decoy.
  window.__fakeFinish = function () {
    try { console.log("%c[whisper]", "color:#ff8a80;",
      "That button does nothing. You are being toyed with."); } catch(_) {}
  };
</script>
</head>
<body>
  <main>
    <h1>watcher</h1>
    <p class="faint">Level 18 of 20.</p>

    <p>
      You are being watched.
    </p>

    <p>
      <button type="button" class="danger" onclick="window.__fakeFinish()">
        finish the game
      </button>
    </p>

    <div class="hints"
         data-h1="Pages can be made of more than just markup. They can also run, react, and speak — sometimes to parts of the browser you rarely visit."></div>
  </main>

  <footer>
    <span class="faintest">// session id: 0xDEADBEEF &nbsp; log: on</span>
  </footer>
</body>
</html>
